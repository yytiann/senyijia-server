<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森易家 - 商户管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
    
    .header { background: #0D9488; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    
    .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: bold; color: #0D9488; }
    
    .filter-bar { background: white; padding: 16px 24px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 12px; }
    .filter-btn { padding: 8px 16px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; }
    .filter-btn.active { background: #0D9488; color: white; border-color: #0D9488; }
    
    .order-list { background: white; border-radius: 12px; overflow: hidden; }
    .order-item { padding: 20px 24px; border-bottom: 1px solid #f0f0f0; }
    .order-item:last-child { border-bottom: none; }
    .order-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .order-id { font-weight: bold; color: #333; }
    .order-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-confirmed { background: #dbeafe; color: #1e40af; }
    .status-scheduled { background: #e0e7ff; color: #3730a3; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .order-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 14px; color: #666; }
    .order-actions { margin-top: 12px; display: flex; gap: 8px; }
    .action-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0D9488; color: white; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    
    .empty { text-align: center; padding: 60px 20px; color: #999; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; }
    .modal-content h3 { margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>森易家商户管理后台</h1>
    <button class="logout-btn" onclick="handleLogout()">退出登录</button>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <h3>总预约数</h3>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <h3>待处理</h3>
        <div class="value" id="pendingCount">0</div>
      </div>
      <div class="stat-card">
        <h3>已完成</h3>
        <div class="value" id="completedCount">0</div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-status="pending">待确认</button>
      <button class="filter-btn" data-status="confirmed">已接单</button>
      <button class="filter-btn" data-status="scheduled">已排期</button>
      <button class="filter-btn" data-status="all">全部</button>
    </div>

    <div class="order-list" id="orderList">
      <div class="empty">加载中...</div>
    </div>
  </div>

  <div class="modal" id="scheduleModal">
    <div class="modal-content">
      <h3>安排排期</h3>
      <div class="form-group">
        <label>预约日期</label>
        <input type="date" id="scheduleDate">
      </div>
      <div class="form-group">
        <label>开始时间</label>
        <input type="time" id="scheduleStartTime" value="09:00">
      </div>
      <div class="form-group">
        <label>服务时长（小时）</label>
        <select id="scheduleDuration">
          <option value="2">2 小时</option>
          <option value="3" selected>3 小时</option>
          <option value="4">4 小时</option>
          <option value="5">5 小时</option>
          <option value="6">6 小时</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="action-btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="action-btn btn-primary" onclick="submitSchedule()">确认排期</button>
      </div>
    </div>
  </div>

  <script>
    let currentFilter = 'pending';
    let currentOrderId = null;
    let orders = [];

    // 检查登录状态
    const token = localStorage.getItem('admin_token');
    if (!token) {
      window.location.href = '/admin/index.html';
    }

    async function loadData() {
      try {
        const [statsRes, ordersRes] = await Promise.all([
          fetch('/api/bookings/meta/statistics'),
          fetch('/api/bookings')
        ]);

        const stats = await statsRes.json();
        const ordersData = await ordersRes.json();

        if (stats.code === 200) {
          document.getElementById('totalCount').textContent = stats.data.total || 0;
          document.getElementById('pendingCount').textContent = (stats.data.byStatus?.pending || 0);
          document.getElementById('completedCount').textContent = (stats.data.byStatus?.completed || 0);
        }

        if (ordersData.code === 200) {
          orders = ordersData.data || [];
          renderOrders();
        }
      } catch (err) {
        console.error('加载数据失败:', err);
      }
    }

    function renderOrders() {
      const list = document.getElementById('orderList');
      const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">暂无订单</div>';
        return;
      }

      list.innerHTML = filtered.map(order => `
        <div class="order-item">
          <div class="order-header">
            <span class="order-id">#${order.id} - ${getServiceName(order.serviceType)}</span>
            <span class="order-status status-${order.status}">${getStatusName(order.status)}</span>
          </div>
          <div class="order-info">
            <div> ${order.address || '未填写'}</div>
            <div>📞 ${order.contactPhone || '未填写'}</div>
            <div>📅 ${order.bookingDate || '未预约'} ${order.timeSlot || ''}</div>
            <div>🏠 ${getVenueName(order.venueType)} · ${order.area || 0}㎡</div>
          </div>
          <div class="order-actions">
            ${order.status === 'pending' ? `<button class="action-btn btn-primary" onclick="confirmOrder(${order.id})">接单</button>` : ''}
            ${order.status === 'confirmed' ? `<button class="action-btn btn-primary" onclick="openSchedule(${order.id})">排期</button>` : ''}
            ${order.status === 'scheduled' ? `<button class="action-btn btn-primary" onclick="completeOrder(${order.id})">完成</button>` : ''}
            <button class="action-btn btn-secondary" onclick="callCustomer('${order.contactPhone}')">联系客户</button>
          </div>
        </div>
      `).join('');
    }

    function getServiceName(type) {
      const names = { formaldehyde: '除甲醛', disinfection: '消杀消毒', comprehensive: '环境综合治理', detection: '环境检测' };
      return names[type] || type;
    }

    function getStatusName(status) {
      const names = { pending: '待确认', confirmed: '已接单', scheduled: '已排期', in_service: '服务中', completed: '已完成', cancelled: '已取消' };
      return names[status] || status;
    }

    function getVenueName(type) {
      const names = { home: '家庭住宅', office: '办公室', shop: '商铺', factory: '厂房', other: '其他' };
      return names[type] || type;
    }

    async function confirmOrder(id) {
      if (!confirm('确认接单？')) return;
      await fetch(`/api/bookings/${id}/confirm`, { method: 'POST' });
      loadData();
    }

    function openSchedule(id) {
      currentOrderId = id;
      const order = orders.find(o => o.id === id);
      if (order?.bookingDate) {
        document.getElementById('scheduleDate').value = order.bookingDate;
      }
      document.getElementById('scheduleModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('scheduleModal').classList.remove('show');
    }

    async function submitSchedule() {
      const bookingDate = document.getElementById('scheduleDate').value;
      const scheduleStartTime = document.getElementById('scheduleStartTime').value;
      const scheduleDuration = document.getElementById('scheduleDuration').value;

      if (!bookingDate) {
        alert('请选择日期');
        return;
      }

      await fetch(`/api/bookings/${currentOrderId}/schedule`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookingDate, timeSlot: 'custom', scheduleStartTime, scheduleDuration: parseInt(scheduleDuration) })
      });

      closeModal();
      loadData();
    }

    async function completeOrder(id) {
      if (!confirm('确认服务已完成？')) return;
      await fetch(`/api/bookings/${id}/complete`, { method: 'POST' });
      loadData();
    }

    function callCustomer(phone) {
      if (phone) {
        window.location.href = `tel:${phone}`;
      }
    }

    function handleLogout() {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_info');
      window.location.href = '/admin/index.html';
    }

    // 筛选按钮
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.status;
        renderOrders();
      });
    });

    // 加载数据
    loadData();
  </script>
</body>
</html>
