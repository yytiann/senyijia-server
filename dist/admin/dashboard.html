<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森易家商户后台 - 管理面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    .header { background: #0D9488; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; }
    .header .user-info { display: flex; align-items: center; gap: 12px; }
    .btn-logout { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stat-card .label { color: #64748B; font-size: 14px; margin-bottom: 8px; }
    .stat-card .value { color: #0F172A; font-size: 32px; font-weight: 600; }
    .stat-card.pending .value { color: #F59E0B; }
    .stat-card.completed .value { color: #10B981; }
    .section { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-header h2 { font-size: 18px; color: #0F172A; }
    .filter-tabs { display: flex; gap: 8px; }
    .filter-tab { padding: 8px 16px; border: 1px solid #E2E8F0; border-radius: 4px; background: white; cursor: pointer; font-size: 14px; }
    .filter-tab.active { background: #0D9488; color: white; border-color: #0D9488; }
    .order-list { display: flex; flex-direction: column; gap: 12px; }
    .order-item { border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .order-info h3 { font-size: 16px; margin-bottom: 8px; }
    .order-info p { color: #64748B; font-size: 14px; margin-bottom: 4px; }
    .order-actions { display: flex; gap: 8px; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #0D9488; color: white; }
    .btn-success { background: #10B981; color: white; }
    .btn-warning { background: #F59E0B; color: white; }
    .btn:hover { opacity: 0.9; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .status-confirmed { background: #DBEAFE; color: #1E40AF; }
    .status-scheduled { background: #E0E7FF; color: #3730A3; }
    .status-completed { background: #D1FAE5; color: #065F46; }
    .empty-state { text-align: center; padding: 40px; color: #64748B; }
  </style>
</head>
<body>
  <div class="header">
    <h1>森易家商户后台</h1>
    <div class="user-info">
      <span id="adminName">管理员</span>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="label">总预约数</div>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="stat-card pending">
        <div class="label">待处理</div>
        <div class="value" id="pendingCount">0</div>
      </div>
      <div class="stat-card completed">
        <div class="label">已完成</div>
        <div class="value" id="completedCount">0</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>订单管理</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" data-status="">全部</button>
          <button class="filter-tab" data-status="pending">待确认</button>
          <button class="filter-tab" data-status="confirmed">已接单</button>
          <button class="filter-tab" data-status="scheduled">已排期</button>
          <button class="filter-tab" data-status="completed">已完成</button>
        </div>
      </div>
      <div class="order-list" id="orderList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    let currentStatus = '';

    // 检查登录状态
    const token = localStorage.getItem('admin_token');
    if (!token) {
      window.location.href = 'login.html';
    }

    // 显示管理员名称
    const adminInfo = JSON.parse(localStorage.getItem('admin_info') || '{}');
    document.getElementById('adminName').textContent = adminInfo.username || '管理员';

    // 退出登录
    function logout() {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_info');
      window.location.href = 'login.html';
    }

    // 加载数据
    async function loadData() {
      try {
        // 加载统计
        const statsRes = await fetch(`${API_BASE}/bookings/meta/statistics`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const statsData = await statsRes.json();
        if (statsData.code === 200) {
          document.getElementById('totalCount').textContent = statsData.data.total || 0;
          document.getElementById('pendingCount').textContent = statsData.data.byStatus?.pending || 0;
          document.getElementById('completedCount').textContent = statsData.data.byStatus?.completed || 0;
        }

        // 加载订单
        const ordersRes = await fetch(`${API_BASE}/bookings${currentStatus ? `?status=${currentStatus}` : ''}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const ordersData = await ordersRes.json();
        if (ordersData.code === 200) {
          renderOrders(ordersData.data || []);
        }
      } catch (err) {
        console.error('加载数据失败:', err);
      }
    }

    // 渲染订单列表
    function renderOrders(orders) {
      const orderList = document.getElementById('orderList');
      if (orders.length === 0) {
        orderList.innerHTML = '<div class="empty-state">暂无订单</div>';
        return;
      }

      const statusMap = {
        pending: { text: '待确认', class: 'status-pending' },
        confirmed: { text: '已接单', class: 'status-confirmed' },
        scheduled: { text: '已排期', class: 'status-scheduled' },
        in_service: { text: '服务中', class: 'status-confirmed' },
        completed: { text: '已完成', class: 'status-completed' },
        cancelled: { text: '已取消', class: 'status-pending' }
      };

      orderList.innerHTML = orders.map(order => {
        const status = statusMap[order.status] || { text: order.status, class: '' };
        return `
          <div class="order-item">
            <div class="order-info">
              <h3>${order.serviceType || '未知服务'} - ${order.contactName || '未知客户'}</h3>
              <p>📞 ${order.contactPhone || '-'}</p>
              <p>📍 ${order.address || '-'}</p>
              <p>📅 ${order.bookingDate || '-'} ${order.timeSlot || '-'}</p>
            </div>
            <div style="text-align: right;">
              <span class="status-badge ${status.class}">${status.text}</span>
              <div class="order-actions" style="margin-top: 12px;">
                ${order.status === 'pending' ? `<button class="btn btn-primary" onclick="confirmOrder(${order.id})">接单</button>` : ''}
                ${order.status === 'confirmed' ? `<button class="btn btn-warning" onclick="scheduleOrder(${order.id})">排期</button>` : ''}
                ${order.status === 'scheduled' ? `<button class="btn btn-success" onclick="completeOrder(${order.id})">完成</button>` : ''}
                <a href="tel:${order.contactPhone}" class="btn btn-primary">拨号</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 订单操作
    async function confirmOrder(id) {
      await fetch(`${API_BASE}/bookings/${id}/confirm`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadData();
    }

    async function scheduleOrder(id) {
      const date = prompt('请输入排期日期 (YYYY-MM-DD):');
      if (date) {
        await fetch(`${API_BASE}/bookings/${id}/schedule`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ bookingDate: date, timeSlot: 'morning' })
        });
        loadData();
      }
    }

    async function completeOrder(id) {
      await fetch(`${API_BASE}/bookings/${id}/complete`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadData();
    }

    // 筛选标签
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        loadData();
      });
    });

    // 初始加载
    loadData();
  </script>
</body>
</html>
