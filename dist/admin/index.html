<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森易家 - 商户管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
    .login-container { max-width: 400px; margin: 100px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .login-container h1 { text-align: center; color: #0D9488; margin-bottom: 30px; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #0D9488; }
    .login-btn { width: 100%; padding: 12px; background: #0D9488; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .login-btn:hover { background: #0f766e; }
    .error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
    .test-info { margin-top: 20px; padding: 15px; background: #f0fdfa; border-radius: 8px; font-size: 13px; color: #0f766e; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>森易家商户后台</h1>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="username" placeholder="请输入账号" value="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" value="admin123">
    </div>
    <button class="login-btn" onclick="handleLogin()">登录</button>
    <div id="errorMsg" class="error-msg"></div>
    <div class="test-info">
      <strong>测试账号：</strong><br>
      账号：admin<br>
      密码：admin123
    </div>
  </div>

  <script>
    async function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (!username || !password) {
        errorMsg.textContent = '请输入账号和密码';
        return;
      }

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.code === 200) {
          localStorage.setItem('admin_token', data.data.token);
          localStorage.setItem('admin_info', JSON.stringify(data.data.admin));
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.msg || '登录失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请重试';
      }
    }

    // 回车登录
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
