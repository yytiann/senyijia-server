<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森易家商户后台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: #0D9488; font-size: 24px; margin-bottom: 8px; }
    .logo p { color: #64748B; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #334155; font-size: 14px; font-weight: 500; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
    .form-group input:focus { outline: none; border-color: #0D9488; }
    .btn-login { width: 100%; padding: 12px; background: #0D9488; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
    .btn-login:hover { background: #0F766E; }
    .error-msg { color: #EF4444; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
    .test-info { margin-top: 20px; padding: 12px; background: #F0FDF4; border-radius: 6px; font-size: 12px; color: #166534; text-align: center; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>森易家</h1>
      <p>商户管理后台</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="username" placeholder="请输入账号" value="admin" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="admin123" required>
      </div>
      <button type="submit" class="btn-login">登录</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <div class="test-info">
      测试账号：admin / admin123
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      
      try {
        const res = await fetch(`${API_BASE}/auth/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (data.code === 200) {
          localStorage.setItem('admin_token', data.data.token);
          localStorage.setItem('admin_info', JSON.stringify(data.data.admin));
          window.location.href = 'dashboard.html';
        } else {
          errorMsg.textContent = data.msg || '登录失败';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请确保后端服务已启动';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
